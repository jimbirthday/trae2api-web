<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trae2api · 控制台</title>
<style>
  :root { color-scheme:dark; --bg:#0c1110; --card:#131b18; --card2:#1b2521; --fg:#edf4f0; --dim:#9baba3; --line:#293630; --ok:#73dbab; --warn:#edc275; --bad:#f28c87; --accent:#73dbab; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; min-height:100vh; }
  button,input,textarea,select { font:inherit; }
  button,summary,select,input[type=checkbox] { cursor:pointer; }
  button,input,textarea,select,summary { touch-action:manipulation; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  button:disabled,select:disabled,input:disabled { cursor:not-allowed; opacity:.45; }
  [hidden] { display:none !important; }
  .wrap { max-width:1440px; margin:0 auto; padding:0 36px 48px; }
  header { display:flex; align-items:center; gap:28px; min-height:94px; border-bottom:1px solid var(--line); margin-bottom:30px; }
  .brand { display:flex; align-items:center; gap:11px; flex-shrink:0; }
  .brand-mark { width:34px; height:34px; display:grid; place-items:center; background:var(--accent); color:var(--bg); border-radius:9px; font:700 20px/1 monospace; }
  h1 { font-size:20px; font-weight:650; letter-spacing:-.7px; }
  h1 small { font-size:12px; color:var(--dim); font-weight:400; margin-left:10px; letter-spacing:0; }
  h2 { font-size:23px; font-weight:600; letter-spacing:-.5px; }
  h3 { font-size:16px; font-weight:600; }
  .tabs { display:flex; gap:5px; flex:1; }
  .tab { padding:10px 13px; border:0; border-radius:8px; font-size:13px; background:none; color:var(--dim); white-space:nowrap; }
  .tab:hover { color:var(--fg); background:var(--card); }
  .tab.active { color:var(--accent); background:#1b3026; }
  .pane { display:none; }
  .pane.active { display:block; }
  .toolbar,.section-actions,.imp-row,.row-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .toolbar { margin-left:auto; flex-wrap:nowrap; }
  .btn,.pgbtn { background:var(--card2); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:9px 14px; font-size:13px; cursor:pointer; transition:background .15s,border-color .15s; white-space:nowrap; }
  .btn:hover:not(:disabled),.pgbtn:hover:not(:disabled) { border-color:#577664; background:#23332a; }
  .btn.primary { background:var(--accent); color:#102219; border-color:var(--accent); font-weight:600; }
  .btn.primary:hover:not(:disabled) { background:#8de8be; }
  .btn.ghost { background:transparent; }
  .btn.danger { color:var(--bad); }
  .btn.sm { padding:6px 10px; font-size:12px; }
  .btn.link { background:none; border:0; color:var(--dim); padding:6px; }
  #ts { color:var(--dim); font-size:11px; white-space:nowrap; }
  .connection { position:relative; }
  .connection summary { list-style:none; }
  .connection summary::-webkit-details-marker { display:none; }
  .keybar { position:absolute; top:46px; right:0; z-index:20; width:310px; display:grid; gap:12px; padding:20px; border:1px solid var(--line); border-radius:12px; background:var(--card); box-shadow:0 16px 50px #0006; }
  .keybar label,.keybar .saved { color:var(--dim); font-size:12px; }
  .keybar .saved { color:var(--ok); }
  input.imp,textarea.imp,select.imp,.keybar input[type=password] { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:13px; min-width:0; }
  .keybar input[type=password] { width:100%; }
  .key-options { display:flex; gap:8px; align-items:center; }
  .section-head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .section-title { display:flex; align-items:baseline; gap:12px; }
  .muted { color:var(--dim); font-size:12px; }
  .summary-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-bottom:24px; }
  .summary-card { padding:20px 22px; background:var(--card); border:1px solid var(--line); border-radius:12px; }
  .summary-label { display:flex; align-items:center; gap:7px; color:var(--dim); font-size:12px; }
  .summary-dot { width:6px; height:6px; border-radius:50%; background:var(--dim); }
  .summary-value { font-size:30px; font-weight:600; margin-top:12px; font-variant-numeric:tabular-nums; letter-spacing:-.8px; }
  .summary-card.available .summary-dot { background:var(--ok); }
  .summary-card.attention .summary-dot { background:var(--warn); }
  .summary-card.available .summary-value { color:var(--ok); }
  .account-panel { background:var(--card); border:1px solid var(--line); border-radius:12px; }
  .filterbar { display:flex; align-items:center; gap:10px; padding:18px 20px; flex-wrap:wrap; }
  .search { flex:1; max-width:360px; min-width:160px; }
  .filterbar .imp { background:var(--bg); }
  .batchbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 20px; background:#16201b; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  #selectionCount { min-width:100px; font-size:12px; font-weight:500; }
  .batch-controls { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .batch-controls select { min-width:136px; }
  .table-scroll { overflow-x:auto; }
  table.accts { width:100%; border-collapse:collapse; font-size:13px; }
  table.accts th,table.accts td { text-align:left; padding:16px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.accts th { color:var(--dim); font-weight:400; font-size:12px; background:#111914; white-space:nowrap; }
  table.accts tr:last-child td { border-bottom:0; }
  table.accts tr:hover td { background:#19241e; }
  table.accts tr.selected td { background:#1b3026; }
  #acctTable table { min-width:880px; }
  .check-cell { width:48px; padding-right:0 !important; }
  input[type=checkbox] { width:16px; height:16px; accent-color:var(--accent); vertical-align:middle; }
  .nick { font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:240px; }
  .uid,.mono { font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace; color:var(--dim); }
  .uid { margin-top:3px; }
  .account-note { color:var(--dim); font-size:12px; margin-top:4px; max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .state-stack { display:flex; align-items:center; gap:5px; flex-wrap:wrap; max-width:180px; }
  .badge { display:inline-block; font-size:11px; padding:3px 8px; border-radius:5px; white-space:nowrap; }
  .b-ok { background:#1c3528; color:var(--ok); }
  .b-warn { background:#362e1e; color:var(--warn); }
  .b-bad { background:#382522; color:var(--bad); }
  .b-dim { background:#26312b; color:var(--dim); }
  .credit-value { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
  .credit-track { height:3px; width:100px; background:var(--line); border-radius:4px; margin-top:7px; overflow:hidden; }
  .credit-track span { display:block; height:100%; background:var(--accent); }
  .row-actions { justify-content:flex-end; flex-wrap:nowrap; }
  .row-menu { max-width:115px; padding:6px !important; font-size:12px !important; background:var(--card2) !important; }
  .toggle { position:relative; display:inline-block; width:32px; height:24px; flex-shrink:0; }
  .toggle input { position:absolute; width:32px; height:24px; opacity:0; }
  .toggle .slider { position:absolute; pointer-events:none; inset:4px 0; background:#3c4941; border-radius:99px; transition:.15s; }
  .toggle .slider:before { content:""; position:absolute; height:12px; width:12px; left:2px; top:2px; background:#c0cdc4; border-radius:50%; transition:.15s; }
  .toggle input:checked + .slider { background:#326a4a; }
  .toggle input:checked + .slider:before { transform:translateX(16px); background:var(--accent); }
  .toggle input:focus-visible + .slider { outline:2px solid var(--accent); outline-offset:3px; }
  .pager { display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:16px 20px; font-size:12px; color:var(--dim); }
  .pgbtn { padding:5px 10px; font-size:12px; }
  .pgbtn.on { color:var(--accent); border-color:#417055; background:#1b3026; }
  .pager select { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 6px; }
  .login-status { font-size:12px; color:var(--dim); white-space:pre-wrap; overflow-wrap:anywhere; }
  .login-status.err { color:var(--bad); }
  .login-status.ok { color:var(--ok); }
  #loginStatus { margin-bottom:16px; }
  .batch-feedback { padding:0 20px; }
  #bulkStatus { padding:12px 0; max-height:190px; overflow:auto; }
  #bulkProgress { width:100%; height:4px; accent-color:var(--accent); margin-bottom:12px; }
  .empty { text-align:center; padding:60px 20px; color:var(--dim); }
  .login-bar,.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
  .login-bar h2,.card h2 { font-size:15px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .card { margin:0; }
  .card.err { border-color:#88514a; }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .badges { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }
  .remain { font-size:32px; font-weight:600; margin:20px 0 12px; font-variant-numeric:tabular-nums; }
  .remain span { font-size:12px; color:var(--dim); font-weight:400; margin-left:7px; }
  .meta { color:var(--dim); font-size:12px; display:flex; gap:14px; flex-wrap:wrap; }
  .meta b { color:var(--fg); font-weight:500; }
  .errline { margin-top:12px; color:var(--bad); font-size:12px; overflow-wrap:anywhere; }
  #reqTable,#usageTable { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; }
  #reqTable table,#usageTable table { min-width:1000px; }
  dialog.modal { position:fixed; inset:0; margin:auto; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:14px; padding:24px; width:min(560px,calc(100% - 32px)); max-height:85dvh; overflow:auto; box-shadow:0 30px 100px #0008; }
  dialog::backdrop { background:#000a; backdrop-filter:blur(3px); }
  .modal-head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; }
  .modal pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; font:12px/1.7 ui-monospace,Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
  .modal label { display:block; color:var(--dim); font-size:12px; margin:18px 0 8px; }
  textarea.imp { width:100%; min-height:135px; resize:vertical; font-family:ui-monospace,Consolas,monospace; }
  .modal .imp-row { margin-top:14px; }
  .modal .login-status { margin-top:12px; }
  .spin { display:inline-block; width:12px; height:12px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:sp .8s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  @media(max-width:1050px) { .wrap { padding:0 22px 36px; } header { gap:16px; flex-wrap:wrap; padding:20px 0; } .tabs { order:3; flex-basis:100%; } #ts { display:none; } .summary-card { padding:17px; } }
  @media(max-width:600px) { .wrap { padding:0 14px 24px; } header { margin-bottom:22px; } h1 small { display:none; } h2 { font-size:21px; } .toolbar { gap:5px; } .toolbar .btn { padding:8px 10px; } .tabs { gap:0; justify-content:space-between; } .tab { flex:1; padding:10px 6px; } .summary-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:18px; } .summary-value { font-size:26px; margin-top:8px; } .section-head { gap:12px; margin-bottom:18px; } .filterbar,.batchbar { padding:14px; } .search { max-width:none; } .filterbar select { width:125px; } .batch-controls { margin-left:0; flex-basis:100%; } .batch-controls select { flex:1; } .pager { padding:14px; gap:5px; } .keybar { width:280px; } .imp,input.imp,textarea.imp,.keybar input[type=password] { font-size:16px; } .row-menu { font-size:12px !important; } .grid { grid-template-columns:1fr; } .section-actions .btn { padding:9px 12px; } }
  @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="brand-mark" aria-hidden="true">/</span><h1>trae2api<small>控制台</small></h1></div>
    <nav class="tabs" aria-label="主导航">
      <button class="tab active" aria-current="page" onclick="switchTab('accounts',this)">账号管理</button>
      <button class="tab" onclick="switchTab('credits',this)">额度监控</button>
      <button class="tab" onclick="switchTab('requests',this)">请求记录</button>
      <button class="tab" onclick="switchTab('usage',this)">用量统计</button>
    </nav>
    <div class="toolbar">
      <span id="ts"></span>
      <button class="btn ghost" onclick="refreshActive(true)">刷新</button>
      <details class="connection"><summary class="btn ghost">连接设置</summary>
        <div class="keybar">
          <label for="apikey">API Key</label>
          <input id="apikey" type="password" placeholder="输入 API Key" oninput="onKeyChange()" autocomplete="off">
          <label class="key-options"><input type="checkbox" id="rememberKey"> 在此浏览器记住密钥</label>
          <div class="imp-row"><button class="btn primary sm" onclick="saveKey()">应用</button><span id="keystatus" class="saved" style="display:none">已应用</span><button class="btn sm ghost" onclick="logout()">退出登录</button></div>
        </div>
      </details>
    </div>
  </header>

  <main>
    <section id="pane-accounts" class="pane active" aria-labelledby="accountsTitle">
      <div class="section-head">
        <div class="section-title"><h2 id="accountsTitle">账号管理</h2><span id="acctMeta" class="muted"></span></div>
        <div class="section-actions">
          <button class="btn ghost" onclick="document.getElementById('importDialog').showModal()">导入账号</button>
          <button class="btn primary" id="loginBtn" onclick="startLogin()">＋ 添加账号</button>
        </div>
      </div>
      <div id="loginStatus" class="login-status" role="status" style="display:none"></div>
      <div class="summary-grid" aria-label="账号概览">
        <div class="summary-card"><div class="summary-label"><span class="summary-dot"></span>账号总数</div><div class="summary-value" id="statTotal">—</div></div>
        <div class="summary-card available"><div class="summary-label"><span class="summary-dot"></span>可用账号</div><div class="summary-value" id="statAvailable">—</div></div>
        <div class="summary-card attention"><div class="summary-label"><span class="summary-dot"></span>需处理</div><div class="summary-value" id="statAttention">—</div></div>
        <div class="summary-card"><div class="summary-label"><span class="summary-dot"></span>剩余积分</div><div class="summary-value" id="statCredits">—</div></div>
      </div>
      <div class="account-panel">
        <div class="filterbar">
          <input class="imp search" id="acctQ" aria-label="搜索账号" placeholder="搜索账号、昵称或备注" oninput="acctFilterChanged()">
          <select class="imp" id="acctStatus" aria-label="账号状态" onchange="acctFilterChanged()">
            <option value="">全部状态</option><option value="ok">正常</option><option value="cooling">冷却中</option><option value="paused">已暂停</option><option value="off">已停用</option><option value="disabled">登录失效</option>
          </select>
        </div>
        <div class="batchbar">
          <span id="selectionCount" role="status" aria-live="polite">未选择账号</span>
          <button class="btn link" id="selectAllResults" onclick="selectAllAccounts()">全选筛选结果</button>
          <button class="btn link" id="clearSelection" onclick="clearSelection()" disabled>清空</button>
          <div class="batch-controls">
            <select class="imp" id="bulkAction" aria-label="批量操作" disabled>
              <option value="checkin">签到领积分</option><option value="balance">刷新额度</option><option value="refresh">刷新 Token</option><option value="test">测试连通性</option><option value="enable">启用账号</option><option value="disable">停用账号</option><option value="pause">暂停调度</option><option value="resume">恢复调度</option><option value="unfreeze">刷新额度并解冻</option><option value="revive">解除禁用</option><option value="export">导出凭证</option><option value="delete">删除账号</option>
            </select>
            <button class="btn sm" id="bulkRun" onclick="runBulk()" disabled>执行</button>
          </div>
        </div>
        <div class="batch-feedback"><div id="bulkStatus" class="login-status" role="status" aria-live="polite" style="display:none"></div><progress id="bulkProgress" value="0" max="1" hidden aria-label="批量操作进度"></progress></div>
        <div id="acctTable" class="table-scroll"><div class="empty"><span class="spin"></span> 加载中</div></div>
        <div id="pgAccts" class="pager"></div>
      </div>
    </section>

    <section id="pane-requests" class="pane" aria-labelledby="requestsTitle">
      <div class="section-head"><h2 id="requestsTitle">请求记录</h2></div>
      <div class="login-bar"><div class="imp-row">
        <input class="imp" id="fUid" aria-label="账号 UID" placeholder="账号 UID" onkeydown="if(event.key==='Enter'){reqState.page=1;loadRequests(true)}">
        <input class="imp" id="fModel" aria-label="模型名称" placeholder="模型名称" onkeydown="if(event.key==='Enter'){reqState.page=1;loadRequests(true)}">
        <select class="imp" id="fOutcome" aria-label="请求结果" onchange="reqState.page=1;loadRequests(true)"><option value="">全部结果</option><option value="success">成功</option><option value="http_error">请求失败</option><option value="stream_error">响应中断</option><option value="interrupted">客户端取消</option></select>
        <button class="btn" onclick="loadRequests(true)">查询</button><button class="btn ghost" onclick="clearReqFilters()">重置</button>
      </div><div id="metricsLine" class="login-status" style="display:none;margin-top:14px"></div></div>
      <div id="reqTable"><div class="empty">暂无记录</div></div><div id="pgReqs" class="pager"></div>
    </section>

    <section id="pane-usage" class="pane" aria-labelledby="usageTitle">
      <div class="section-head"><h2 id="usageTitle">用量统计</h2><span id="usageMeta" class="login-status" style="display:none"></span></div>
      <div class="grid" id="usageKpi" style="margin-bottom:18px"></div>
      <div id="usageTable"><div class="empty">暂无用量</div></div><div id="pgUsage" class="pager"></div>
      <p class="muted" style="margin:8px 0 24px">积分消耗为采样估算，暂无样本时显示「—」。</p>
      <div class="card"><h3>模型别名</h3><label for="aliasBox" class="muted" style="display:block;margin:10px 0">每行一个映射，例如 gpt-4o=glm-5.2</label>
        <textarea class="imp" id="aliasBox" rows="4" spellcheck="false" placeholder="gpt-4o=glm-5.2&#10;fast=kimi-k3"></textarea>
        <div class="imp-row" style="margin-top:12px"><button class="btn primary" id="aliasSave">保存</button><button class="btn ghost" id="aliasReload">重载</button><span id="aliasStatus" class="login-status" style="display:none"></span></div>
      </div>
    </section>

    <section id="pane-credits" class="pane" aria-labelledby="creditsTitle">
      <div class="section-head"><h2 id="creditsTitle">额度监控</h2><button class="btn" onclick="loadCredits(true)">查询最新额度</button></div>
      <div id="creditMeta" class="login-status" style="display:none;margin-bottom:18px"></div>
      <div class="grid" id="grid"><div class="empty"><span class="spin"></span> 加载中</div></div><div id="pgCredits" class="pager"></div>
    </section>
  </main>
</div>

<dialog class="modal" id="importDialog" aria-labelledby="importTitle">
  <div class="modal-head"><h3 id="importTitle">导入账号</h3><button class="btn sm ghost" onclick="document.getElementById('importDialog').close()">关闭</button></div>
  <button class="btn" onclick="document.getElementById('impFile').click()">选择 JSON 文件</button>
  <input type="file" id="impFile" accept=".json,application/json" multiple onchange="importFiles(this)" hidden>
  <label for="impInput">或粘贴回调链接、账号 JSON</label>
  <textarea class="imp" id="impInput" placeholder="粘贴登录回调链接或账号 JSON" spellcheck="false"></textarea>
  <div class="imp-row"><button class="btn primary" onclick="importCred()">导入</button></div>
  <div id="impStatus" class="login-status" role="status" style="display:none"></div>
</dialog>
<dialog class="modal" id="modalBg" aria-labelledby="modalTitle">
  <div class="modal-head"><h3 id="modalTitle">凭证预览</h3><button class="btn sm ghost" onclick="closeModal()">关闭</button></div><pre id="modalBody"></pre>
</dialog>

<script>
let activeTab = 'accounts';
let loginPollTimer = null;

/* ─── 通用：请求缓存 + 竞态防护 + 分页器 ───
   apiGet 的语义：
     - 同一 URL 的并发请求合并成一次（快速切 tab 不再打出多份）
     - 结果缓存 ttl 毫秒；force=true 绕过缓存
     - 每个视图一个 AbortController：切走时旧请求作废，避免慢请求回来覆盖新结果 */
const apiCache = new Map();      // url -> {at, data}
const apiInflight = new Map();   // url -> Promise
const viewAbort = {};            // view -> AbortController

function abortView(view){
  const c = viewAbort[view];
  if(c){ c.abort(); delete viewAbort[view]; }
  return new AbortController();
}
function viewSignal(view){
  if(!viewAbort[view]) viewAbort[view] = new AbortController();
  return viewAbort[view].signal;
}
const viewSeq = {};               // view -> 最近一次请求序号（用于丢弃过期结果）
function staleError(){ const e = new Error('stale'); e.name = 'AbortError'; return e; }

async function apiGet(url, view, ttl, force){
  ttl = ttl || 0;
  const seq = view ? (viewSeq[view] = (viewSeq[view]||0) + 1) : 0;

  if(!force){
    const c = apiCache.get(url);
    if(c && (Date.now() - c.at) < ttl) return c.data;
    const p = apiInflight.get(url);
    if(p){ const d = await p; if(view && seq !== viewSeq[view]) throw staleError(); return d; }
  }
  const p = (async ()=>{
    const r = await fetch(url, {cache:'no-store', signal: view? viewSignal(view): undefined});
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(apiErr(d));
    apiCache.set(url, {at: Date.now(), data: d});
    return d;
  })();
  apiInflight.set(url, p);
  try {
    const d = await p;
    // 同一视图内快速连续翻页时，只让「最后一次点击」的结果上屏。
    if(view && seq !== viewSeq[view]) throw staleError();
    return d;
  } finally { apiInflight.delete(url); }
}
function invalidate(prefix){
  for(const k of Array.from(apiCache.keys())){ if(k.startsWith(prefix)) apiCache.delete(k); }
}

/* 分页器：容器 id + 页码 + 每页 + 总数（total<0 表示未知，退化为相对翻页） */
/* 分页器：容器 id + 页码 + 每页 + 总数（total<0 表示未知，退化为相对翻页）
   按钮全部用 data-page / data-size 承载参数，点击由事件委托统一处理——
   不把任何变量拼进内联 onclick，避免动态数据逃逸成可执行脚本。 */
function renderPager(elId, page, pageSize, total, onGo, extra){
  const el = document.getElementById(elId);
  if(!el) return;
  el.dataset.ongo = onGo;              // 分页回调函数名（代码常量，非用户数据）
  const known = total >= 0;
  const pages = known ? Math.max(1, Math.ceil(total / pageSize)) : 0;
  let html = '';
  html += '<button class="pgbtn" data-page="'+(page-1)+'"'+(page<=1?' disabled':'')+'>上一页</button>';
  if(known){
    // 最多显示 7 个页码，当前页居中
    let from = Math.max(1, page-3), to = Math.min(pages, from+6);
    from = Math.max(1, to-6);
    if(from > 1) html += '<button class="pgbtn" data-page="1">1</button>'+(from>2?'<span>…</span>':'');
    for(let i=from; i<=to; i++){
      html += '<button class="pgbtn'+(i===page?' on':'')+'" data-page="'+i+'">'+i+'</button>';
    }
    if(to < pages) html += (to<pages-1?'<span>…</span>':'')+'<button class="pgbtn" data-page="'+pages+'">'+pages+'</button>';
  } else {
    html += '<span style="padding:0 6px">第 '+page+' 页（带过滤条件时总数未知）</span>';
  }
  html += '<button class="pgbtn" data-page="'+(page+1)+'"'+(known && page>=pages?' disabled':'')+'>下一页</button>';
  html += '<span style="margin-left:6px">共 '+(known? fmt(total) : '?')+' 条';
  if(known) html += ' · 第 '+page+'/'+pages+' 页';
  html += '</span>';
  html += '<span style="margin-left:auto">每页 <select class="pgsize">';
  for(const n of [10,20,50,100,200]){
    html += '<option value="'+n+'"'+(n===pageSize?' selected':'')+'>'+n+'</option>';
  }
  html += '</select> 条</span>';
  el.innerHTML = html + (extra||'');
}

/* 分页事件委托：所有分页容器共用一个监听。 */
document.addEventListener('click', function(e){
  const btn = e.target.closest ? e.target.closest('.pgbtn[data-page]') : null;
  if(!btn || btn.disabled) return;
  const box = btn.parentElement;
  const fn = box && box.dataset ? box.dataset.ongo : '';
  const cb = fn && window[fn];
  if(typeof cb === 'function') cb(Number(btn.dataset.page)||1);
});
document.addEventListener('change', function(e){
  const sel = e.target;
  if(!sel || !sel.classList || !sel.classList.contains('pgsize')) return;
  const box = sel.parentElement && sel.parentElement.parentElement;
  const fn = box && box.dataset ? box.dataset.ongo : '';
  const cb = fn && window[fn];
  if(typeof cb === 'function') cb(1, sel.value);
});

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function badge(text, cls){ return '<span class="badge '+cls+'">'+esc(text)+'</span>'; }
function fmt(n){ return (n==null?'-':Number(n).toLocaleString()); }
function authHeader(){
  const k = getKey();
  return k ? { 'Authorization': 'Bearer ' + k } : {};
}
function apiErr(d, fallback){
  if(d && d.error && d.error.code === 'invalid_api_key'){
    return '登录已失效，请在连接设置中更新 API Key';
  }
  return (d && (d.error?.message || d.message)) || fallback || '请求失败';
}
function getKey(){ return document.getElementById('apikey').value.trim(); }
function onKeyChange(){ document.getElementById('keystatus').style.display='none'; }
async function saveKey(){
  const k = getKey();
  if(!k){ alert('请填写 API Key'); return; }
  // 换 cookie（会话），成功后刷新页面
  const r = await fetch('/admin/api/session', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({key:k})
  });
  if(!r.ok){
    const d = await r.json().catch(()=>({}));
    alert('Key 不正确：'+apiErr(d));
    return;
  }
  // 默认只写 sessionStorage（关标签页即失效，缩小凭据暴露面）；
  // 勾选「记住」才落盘到 localStorage（明文本地存储，谨慎使用）。
  sessionStorage.setItem('tw2a_admin_key', k);
  if(document.getElementById('rememberKey') && document.getElementById('rememberKey').checked){
    localStorage.setItem('tw2a_admin_key', k);
  } else {
    localStorage.removeItem('tw2a_admin_key');
  }
  const s = document.getElementById('keystatus');
  s.style.display=''; s.textContent='已应用';
  setTimeout(()=>location.reload(), 300);
}
async function logout(){
  await fetch('/admin/api/session', {method:'DELETE'});
  sessionStorage.removeItem('tw2a_admin_key');
  localStorage.removeItem('tw2a_admin_key');
  location.reload();
}
(function loadKey(){
  const mem = sessionStorage.getItem('tw2a_admin_key') || '';
  const disk = localStorage.getItem('tw2a_admin_key') || '';
  const k = mem || disk;
  if(k){ document.getElementById('apikey').value = k; sessionStorage.setItem('tw2a_admin_key', k); }
  if(disk && document.getElementById('rememberKey')) document.getElementById('rememberKey').checked = true;
})();

function switchTab(name, el){
  if(activeTab && activeTab !== name) abortView(activeTab); // 作废上一个 tab 的在途请求
  activeTab = name;
  document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active');t.removeAttribute('aria-current');});
  el.classList.add('active');
  el.setAttribute('aria-current','page');
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('pane-'+name).classList.add('active');
  refreshActive(false);
}
function refreshActive(force){
  if(activeTab==='accounts') loadAccounts(force);
  else if(activeTab==='credits') loadCredits(!!force); // 切 tab 走缓存，点刷新才打上游
  else if(activeTab==='usage'){ loadUsage(force); loadAliases(); }
  else loadRequests(force);
}

/* ─── 账号管理 ─── */
const acctState = { page:1, pageSize:20, total:0, visible:[] };
const selectedAccounts = new Map();
let acctFilterTimer = null;
let bulkBusy = false;
function accountQuery(page=acctState.page, pageSize=acctState.pageSize){
  const q = new URLSearchParams({page, page_size:pageSize});
  const keyword = document.getElementById('acctQ').value.trim();
  const status = document.getElementById('acctStatus').value;
  if(keyword) q.set('q', keyword);
  if(status) q.set('status', status);
  return q;
}
function acctFilterChanged(){
  clearSelection();
  clearTimeout(acctFilterTimer);
  acctFilterTimer = setTimeout(()=>{ acctState.page=1; loadAccounts(true); }, 250);
}
function gotoAccts(page, pageSize){
  if(pageSize) acctState.pageSize = Number(pageSize)||20;
  acctState.page = Math.max(1, page||1);
  loadAccounts(true);
}
async function loadAccounts(force){
  const el = document.getElementById('acctTable');
  try{
    const d = await apiGet('/admin/api/accounts?'+accountQuery(), 'accounts', 3000, force);
    acctState.total = d.total ?? (d.accounts||[]).length;
    acctState.page = d.page || acctState.page;
    acctState.pageSize = d.page_size || acctState.pageSize;
    if(acctState.page>1 && acctState.page>Math.max(1,d.pages||1)){
      acctState.page = Math.max(1,d.pages||1);
      return loadAccounts(true);
    }
    renderAccounts(d.accounts||[]);
    document.getElementById('acctMeta').textContent = fmt(acctState.total)+' 个账号';
    const summary = d.summary||{};
    for(const [id,key] of [['statTotal','total'],['statAvailable','available'],['statAttention','attention'],['statCredits','credits']]){
      document.getElementById(id).textContent = fmt(summary[key] ?? 0);
    }
    renderPager('pgAccts', acctState.page, acctState.pageSize, acctState.total, 'gotoAccts');
    document.getElementById('ts').textContent = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
  }catch(e){
    if(e.name==='AbortError') return;
    el.innerHTML = '<div class="empty" style="color:var(--bad)">加载失败：'+esc(e.message)+'</div>';
  }
}
function renderAccounts(accts){
  acctState.visible = accts;
  const el = document.getElementById('acctTable');
  if(!accts.length){
    const filtered = document.getElementById('acctQ').value.trim() || document.getElementById('acctStatus').value;
    el.innerHTML = '<div class="empty">'+(filtered?'没有匹配的账号':'暂无账号，添加或导入账号开始使用')+'</div>';
    updateSelection();
    return;
  }
  const rows = accts.map(a=>{
    let state = a.disabled ? badge('登录失效','b-bad') : !a.enabled ? badge('已停用','b-dim')
      : a.paused ? badge('已暂停','b-dim') : a.cooling ? badge('冷却中','b-warn') : badge('正常','b-ok');
    if(a.model_blocked?.length) state += badge(a.model_blocked.length+' 模型限额','b-dim');
    if(a.expired_soon) state += badge('即将过期','b-warn');
    const date = a.expires_at ? new Date(a.expires_at*1000).toLocaleDateString('zh-CN') : '有效期未知';
    const ratio = a.credits_total>0 ? Math.max(0,Math.min(100,a.credits/a.credits_total*100)) : 0;
    return '<tr data-uid="'+esc(a.uid)+'" data-paused="'+(a.paused?'1':'0')+'">'
      + '<td class="check-cell"><input type="checkbox" data-select="'+esc(a.uid)+'" aria-label="选择 '+esc(a.nickname||a.uid)+'"></td>'
      + '<td><div class="nick">'+esc(a.nickname||'未命名账号')+'</div><div class="uid">'+esc(a.uid)+'</div>'
        + (a.note?'<div class="account-note" title="'+esc(a.note)+'">'+esc(a.note)+'</div>':'')+'</td>'
      + '<td><div class="state-stack" title="'+esc(a.reason||a.cool_kind||'')+'">'+state+'</div></td>'
      + '<td><div class="credit-value">'+fmt(a.credits)+' <span class="muted">/ '+fmt(a.credits_total||0)+'</span></div>'
        + '<div class="credit-track"><span style="width:'+ratio+'%"></span></div></td>'
      + '<td><div class="mono">'+esc(date)+'</div><div class="muted">在途 '+(a.in_flight||0)+' / '+(a.max_in_flight||0)+' · 权重 '+esc(a.weight||1)+'</div></td>'
      + '<td><div class="row-actions">'
        + '<label class="toggle"><input type="checkbox" data-act="toggle" aria-label="启用 '+esc(a.nickname||a.uid)+'" data-locked="'+(a.disabled?'1':'0')+'" '+(a.enabled&&!a.disabled?'checked':'')+' '+(a.disabled?'disabled':'')+'><span class="slider"></span></label>'
        + '<button class="btn sm ghost" data-act="checkin">签到</button>'
        + '<select class="imp row-menu" data-act="menu" aria-label="'+esc(a.nickname||a.uid)+' 的更多操作">'
          + '<option value="">更多操作</option><option value="refresh">刷新 Token</option><option value="balance">刷新额度</option>'
          + '<option value="pause">'+(a.paused?'恢复调度':'暂停调度')+'</option><option value="unfreeze">刷新额度并解冻</option>'
          + (a.disabled?'<option value="revive">解除禁用</option>':'')
          + '<option value="profile">权重与备注</option><option value="test">测试连通性</option><option value="json">凭证预览</option><option value="delete">删除账号</option>'
        + '</select></div></td></tr>';
  }).join('');
  el.innerHTML = '<table class="accts"><thead><tr><th class="check-cell"><input type="checkbox" data-select-page aria-label="选择当前页"></th>'
    + '<th>账号</th><th>状态</th><th>积分余额</th><th>Token 有效期</th><th style="text-align:right">操作</th></tr></thead><tbody>'+rows+'</tbody></table>';
  updateSelection();
}
function updateSelection(){
  const n = selectedAccounts.size;
  document.getElementById('selectionCount').textContent = n?'已选择 '+n+' 个账号':'未选择账号';
  document.getElementById('bulkRun').disabled = bulkBusy || !n;
  document.getElementById('bulkAction').disabled = bulkBusy || !n;
  document.getElementById('clearSelection').disabled = bulkBusy || !n;
  document.getElementById('selectAllResults').disabled = bulkBusy || !acctState.total;
  document.getElementById('acctQ').disabled = bulkBusy;
  document.getElementById('acctStatus').disabled = bulkBusy;
  document.querySelectorAll('#acctTable [data-select]').forEach(input=>{
    input.checked = selectedAccounts.has(input.dataset.select);
    input.disabled = bulkBusy;
    input.closest('tr').classList.toggle('selected',input.checked);
  });
  const all = document.querySelector('#acctTable [data-select-page]');
  if(all){
    const count = acctState.visible.filter(a=>selectedAccounts.has(a.uid)).length;
    all.checked = count>0 && count===acctState.visible.length;
    all.indeterminate = count>0 && count<acctState.visible.length;
    all.disabled = bulkBusy;
  }
  document.querySelectorAll('#acctTable [data-act]').forEach(el=>{ el.disabled=bulkBusy || el.dataset.locked==='1'; });
}
function clearSelection(){
  if(bulkBusy) return;
  selectedAccounts.clear();
  updateSelection();
}
async function selectAllAccounts(){
  if(bulkBusy) return;
  bulkBusy = true;
  updateSelection();
  const st = document.getElementById('bulkStatus');
  st.style.display=''; st.className='login-status'; st.textContent='正在选择账号…';
  try{
    const accounts = new Map();
    for(let page=1,pages=1; page<=pages; page++){
      const d = await apiGet('/admin/api/accounts?'+accountQuery(page,200), null, 0, true);
      pages = d.pages||1;
      for(const a of d.accounts||[]) accounts.set(a.uid,{uid:a.uid,nickname:a.nickname});
    }
    selectedAccounts.clear();
    for(const [uid,a] of accounts) selectedAccounts.set(uid,a);
    st.textContent='已选择 '+selectedAccounts.size+' 个账号';
  }catch(e){ st.className='login-status err'; st.textContent='选择失败：'+e.message; }
  finally { bulkBusy=false; updateSelection(); }
}
function acctAct(e){
  const el = e.target.closest('[data-act]');
  if(!el || bulkBusy) return;
  if((el.dataset.act==='toggle' || el.dataset.act==='menu') && e.type==='click') return;
  const box = el.closest('[data-uid]');
  if(!box) return;
  const uid = box.dataset.uid;
  const action = el.dataset.act==='menu'?el.value:el.dataset.act;
  if(el.dataset.act==='menu') el.value='';
  const target = acctState.visible.find(a=>a.uid===uid);
  switch(action){
    case 'toggle': toggleAcct(uid,el.checked); break;
    case 'checkin': case 'refresh': case 'balance': case 'unfreeze': case 'revive': case 'delete': runBulk(action,[{uid,nickname:target?.nickname}]); break;
    case 'pause': pauseAcct(uid,box.dataset.paused!=='1'); break;
    case 'profile': editProfile(uid); break;
    case 'test': testAcct(uid); break;
    case 'json': showJSON(uid); break;
  }
}
(function bindAcctDelegation(){
  const table = document.getElementById('acctTable');
  table.addEventListener('click',acctAct);
  table.addEventListener('change',e=>{
    if(bulkBusy) return;
    const el = e.target;
    if(el.hasAttribute('data-select-page')){
      for(const a of acctState.visible){
        if(el.checked) selectedAccounts.set(a.uid,{uid:a.uid,nickname:a.nickname});
        else selectedAccounts.delete(a.uid);
      }
      updateSelection();
    } else if(el.hasAttribute('data-select')){
      const a = acctState.visible.find(a=>a.uid===el.dataset.select);
      if(el.checked) selectedAccounts.set(a.uid,{uid:a.uid,nickname:a.nickname});
      else selectedAccounts.delete(a.uid);
      updateSelection();
    } else { acctAct(e); }
  });
})();

async function toggleAcct(uid, enabled){
  const r = await fetch('/admin/api/accounts/'+encodeURIComponent(uid), {
    method:'PATCH', headers:{'Content-Type':'application/json', ...authHeader()},
    body: JSON.stringify({enabled: enabled})
  });
  invalidate('/admin/api/accounts');
  if(!r.ok){ const e = await r.json().catch(()=>({})); alert('切换失败：'+apiErr(e)); loadAccounts(true); return; }
  loadAccounts(true);
}
async function showJSON(uid){
  const r = await fetch('/admin/api/accounts/'+encodeURIComponent(uid)+'/json', {cache:'no-store'});
  const d = await r.json();
  document.getElementById('modalTitle').textContent = '凭证预览 · '+(d.nickname||d.uid);
  document.getElementById('modalBody').textContent = JSON.stringify(d, null, 2);
  document.getElementById('modalBg').showModal();
}
function closeModal(){ document.getElementById('modalBg').close(); }

/* ─── 运维动作 ─── */
async function apiRequest(path, method='POST', payload){
  const r=await fetch(path,{method,headers:{'Content-Type':'application/json',...authHeader()},body:payload===undefined?undefined:JSON.stringify(payload)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(apiErr(d));
  return d;
}
async function post(path,payload){
  try { return await apiRequest(path,'POST',payload); }
  catch(e){ alert('操作失败：'+e.message); return null; }
}
async function pauseAcct(uid, pause){
  const d = await post('/admin/api/accounts/'+encodeURIComponent(uid)+(pause?'/pause':'/resume'));
  if(d){ invalidate('/admin/api/accounts'); loadAccounts(true); }
}
async function editProfile(uid){
  const w = prompt('调度权重（1–100，数值越大越优先）','1');
  if(w===null) return;
  const n = prompt('备注','');
  if(n===null) return;
  const d = await post('/admin/api/accounts/'+encodeURIComponent(uid)+'/profile', {weight: Number(w)||1, note: n});
  if(d){ invalidate('/admin/api/accounts'); loadAccounts(true); }
}
const bulkLabels = {checkin:'签到',balance:'刷新额度',refresh:'刷新 Token',test:'连通测试',enable:'启用',disable:'停用',pause:'暂停调度',resume:'恢复调度',unfreeze:'刷新额度并解冻',revive:'解除禁用',export:'导出',delete:'删除'};
async function runBulk(action, targets){
  if(bulkBusy) return;
  action = action || document.getElementById('bulkAction').value;
  targets = targets || Array.from(selectedAccounts.values());
  if(!targets.length || !bulkLabels[action]) return;
  if(action==='delete' && !confirm('确定删除这 '+targets.length+' 个账号？凭证文件会一并删除，无法撤销。\n\n'+targets.slice(0,10).map(a=>a.nickname||a.uid).join('\n')+(targets.length>10?'\n…':''))) return;
  if((action==='unfreeze' || action==='revive') && !confirm('对 '+targets.length+' 个账号执行「'+bulkLabels[action]+'」？将重置冷却、熔断与失败状态。')) return;
  bulkBusy = true;
  updateSelection();
  const st = document.getElementById('bulkStatus');
  const progress = document.getElementById('bulkProgress');
  st.style.display=''; st.className='login-status';
  progress.hidden=false; progress.max=targets.length; progress.value=0;
  let done=0, success=0;
  const failed=[];
  const report=()=>{ progress.value=done; st.textContent=bulkLabels[action]+'中 · '+done+' / '+targets.length; };
  report();
  try{
    if(action==='export'){
      if(!await exportCreds(targets.map(a=>a.uid))){ st.textContent='已取消导出'; return; }
      success=targets.length; done=targets.length;
    } else if(['enable','disable','pause','resume'].includes(action)){
      const d=await apiRequest('/admin/api/accounts/set_all','POST',{action,uids:targets.map(a=>a.uid)});
      success=d.changed; done=targets.length;
      if(success<targets.length) failed.push('部分账号状态已变化，请刷新后重试');
    } else {
      let next=0;
      await Promise.all(Array.from({length:Math.min(4,targets.length)},async()=>{
        while(next<targets.length){
          const a=targets[next++];
          try{
            const base='/admin/api/accounts/'+encodeURIComponent(a.uid);
            const d=action==='checkin'
              ? await apiRequest('/admin/api/checkin_all','POST',{uids:[a.uid]})
              : await apiRequest(base+(action==='delete'?'':'/'+(action==='unfreeze'?'balance?apply=1':action)),action==='delete'?'DELETE':'POST');
            if(action==='checkin'){
              const result=d.accounts?.[0];
              if(!result || result.error || !result.checked_in) throw new Error(result?.error||'签到未完成');
            }
            if(action==='test' && !d.ok) throw new Error(d.error||'连通测试失败');
            if(action==='delete') selectedAccounts.delete(a.uid);
            success++;
          }catch(e){ failed.push((a.nickname||a.uid)+'：'+e.message); }
          finally { done++; report(); }
        }
      }));
    }
    progress.value=done;
    st.className='login-status '+(failed.length?'err':'ok');
    st.textContent=bulkLabels[action]+'完成：成功 '+success+' / '+targets.length+(failed.length?'\n'+failed.join('\n'):'');
  }catch(e){ st.className='login-status err'; st.textContent=bulkLabels[action]+'失败：'+e.message; }
  finally {
    progress.hidden=true;
    bulkBusy=false;
    updateSelection();
    if(action!=='export'){
      invalidate('/admin/api/accounts'); invalidate('/admin/api/credits');
      await loadAccounts(true);
    }
  }
}

/* ─── 用量统计 ─── */
function pct(v){ return (v==null||v===0)?'-':Number(v).toFixed(1)+'%'; }
function tps(v){ return (v==null||v===0)?'-':Number(v).toFixed(1); }
function ms(v){ return (v==null||v===0)?'-':Math.round(v); }
function cpm(v){ return (v==null||v===0)?'-':Number(v).toFixed(1); }
const usageState = { page:1, pageSize:50, total:0, sort:'requests' };
function gotoUsage(page, pageSize){
  if(pageSize) usageState.pageSize = Number(pageSize)||50;
  usageState.page = Math.max(1, page||1);
  loadUsage(true);
}
(function bindUsageSort(){
  const el = document.getElementById('usageTable');
  if(!el) return;
  el.addEventListener('click', function(e){
    const th = e.target.closest ? e.target.closest('th[data-sort]') : null;
    if(th) sortUsage(th.dataset.sort);
  });
})();
/* 模型别名：面板读写（GET /admin/api/aliases，POST 同路径）。
   失败时把后端错误原文显示出来（它是可读的中文校验信息），不要吞掉。 */
function aliasesToText(m){
  return Object.keys(m||{}).sort().map(k=>k+'='+m[k]).join('\n');
}
function textToAliases(text){
  const out = {};
  for(const raw of (text||'').split('\n')){
    const line = raw.trim();
    if(!line) continue;
    const i = line.indexOf('=');
    if(i <= 0) continue;
    out[line.slice(0,i).trim()] = line.slice(i+1).trim();
  }
  return out;
}
async function loadAliases(){
  const box = document.getElementById('aliasBox');
  const st = document.getElementById('aliasStatus');
  if(!box) return;
  try{
    const d = await apiGet('/admin/api/aliases', 'aliases', 3000);
    box.value = aliasesToText(d.aliases);
    st.style.display='none';
  }catch(e){
    if(e.name === 'AbortError') return;
    st.style.display=''; st.className='login-status err'; st.textContent='载入失败：'+e.message;
  }
}
async function saveAliases(){
  const box = document.getElementById('aliasBox');
  const st = document.getElementById('aliasStatus');
  const btn = document.getElementById('aliasSave');
  btn.disabled = true;
  try{
    const r = await fetch('/admin/api/aliases', {
      method:'POST', headers:{'Content-Type':'application/json', ...authHeader()},
      body: JSON.stringify({aliases: textToAliases(box.value)})
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(apiErr(d));
    box.value = aliasesToText(d.aliases);
    invalidate('/admin/api/aliases');
    st.style.display=''; st.className='login-status ok';
    st.textContent='已保存（立即生效）';
  }catch(e){
    st.style.display=''; st.className='login-status err'; st.textContent='保存失败：'+e.message;
  }finally{
    btn.disabled = false;
  }
}
document.getElementById('aliasSave').addEventListener('click', saveAliases);
document.getElementById('aliasReload').addEventListener('click', loadAliases);
function sortUsage(key){
  usageState.sort = key;
  usageState.page = 1;
  loadUsage(true);
}
async function loadUsage(force){
  const el = document.getElementById('usageTable');
  const meta = document.getElementById('usageMeta');
  const q = new URLSearchParams();
  q.set('page', usageState.page);
  q.set('page_size', usageState.pageSize);
  q.set('sort', usageState.sort);
  try{
    const d = await apiGet('/admin/api/usage?'+q.toString(), 'usage', 5000, force);
    if(!d.enabled){
      el.innerHTML = '<div class="empty">用量统计未开启</div>';
      return;
    }
    meta.style.display='';
    meta.className='login-status';
    meta.textContent = '统计自 ' + new Date(d.snapshot.started_at).toLocaleString('zh-CN');
    usageState.total = (d.total==null? (d.snapshot.models||[]).length : d.total);
    usageState.page = d.page || usageState.page;
    usageState.pageSize = d.page_size || usageState.pageSize;
    renderUsage(d.snapshot);
    renderPager('pgUsage', usageState.page, usageState.pageSize, usageState.total, 'gotoUsage');
  }catch(e){
    if(e.name === 'AbortError') return;
    el.innerHTML='<div style="color:var(--bad)">加载失败：'+esc(e.message)+'</div>';
  }
}
function renderUsage(snap){
  const el = document.getElementById('usageTable');
  const rows = (snap.models||[]);
  const t = snap.totals || {};
  // 顶部 KPI：整体缓存率 + 整体积分/百万 + 请求量
  const kpi = document.getElementById('usageKpi');
  if(kpi){
    const card = (label,val,sub)=>'<div class="card" style="padding:14px 16px"><div style="font-size:11px;color:var(--dim);margin-bottom:6px">'+label+'</div>'
      +'<div style="font-size:22px;font-weight:600" class="mono">'+val+'</div>'
      +(sub?'<div style="font-size:11px;color:var(--dim);margin-top:6px">'+sub+'</div>':'')+'</div>';
    kpi.innerHTML = card('缓存命中率', pct(t.cache_rate_pct),
                        fmt(t.cache_read_tokens||0)+' / '+fmt(t.prompt_tokens||0)+' input tokens')
      + card('积分 / 百万 Token', cpm(t.credits_per_million),
             t.credit_samples?('采样 '+fmt(t.credit_samples)+' 次 · 累计 '+(t.sampled_credits||0).toFixed(2)+' 积分'):'暂无采样')
      + card('平均吞吐', tps(t.avg_tps)+' tok/s',
             t.timing_samples?(fmt(t.timed_completion_tokens||0)+' token / '+fmt(Math.round((t.gen_ms_sum||0)/1000))+'s 生成 · 首字 '+ms(t.avg_ttft_ms)+'ms'):'暂无样本')
      + card('累计请求', fmt(t.requests),
             fmt(usageState.total)+' 个模型 · 总计 '+fmt(t.total_tokens||0)+' tokens');
  }
  if(!rows.length){
    el.innerHTML = '<div class="empty">暂无用量数据</div>';
    return;
  }
  const sortBtn = (key, label) => '<th class="sortable" data-sort="'+esc(key)+'" style="cursor:pointer;user-select:none" title="点击排序">'
    + label + (usageState.sort===key? ' ↓':'')+'</th>';
  let html = '<table class="accts"><thead><tr>'
    + sortBtn('model','模型')+sortBtn('requests','请求')+sortBtn('tokens','输入 token')
    + '<th>输出 token</th><th>缓存命中</th>'+sortBtn('cache','缓存率')+sortBtn('credits','积分/百万 token')
    + sortBtn('tps','吞吐')+'<th title="客户端看到第一个字（含选号/建连/上游排队/首包）">首字</th>'
    + '<th title="首帧→末帧的纯生成时长">平均生成</th><th title="计时样本数（流式）／积分采样次数">样本</th>'
    + '</tr></thead><tbody>';
  for(const m of rows){
    html += '<tr>'
      + '<td class="mono">'+esc(m.model)+'</td>'
      + '<td class="mono">'+fmt(m.requests)+'</td>'
      + '<td class="mono">'+fmt(m.prompt_tokens||0)+'</td>'
      + '<td class="mono">'+fmt(m.completion_tokens||0)+'</td>'
      + '<td class="mono">'+fmt(m.cache_read_tokens||0)+'</td>'
      + '<td class="mono">'+pct(m.cache_rate_pct)+'</td>'
      + '<td class="mono">'+cpm(m.credits_per_million)+'</td>'
      + '<td class="mono" title="加权吞吐：累计 output token ÷ 累计生成时长">'+tps(m.avg_tps)+' tok/s'
        + (m.avg_char_ps? '<div style="font-size:10px;color:var(--dim)">'+tps(m.avg_char_ps)+' 字/s</div>':'')
        + '</td>'
      + '<td class="mono" style="color:var(--dim)">'+ms(m.avg_ttft_ms)+'ms</td>'
      + '<td class="mono" style="color:var(--dim)">'+ms(m.avg_gen_ms)+'ms</td>'
      + '<td class="mono" style="color:var(--dim)" title="计时样本数（仅流式、有生成时长）">'+fmt(m.timing_samples||0)
        + (m.credit_samples? '<div style="font-size:10px">积分 '+fmt(m.credit_samples)+'</div>':'')+'</td>'
      + '</tr>';
  }
  // 合计行（加权，不是简单平均）
  html += '<tr style="border-top:2px solid #3a4152;font-weight:600">'
    + '<td>'+(esc(t.model)||'合计')+' <span style="font-size:11px;color:var(--dim);font-weight:400">（全量）</span></td>'
    + '<td class="mono">'+fmt(t.requests)+'</td>'
    + '<td class="mono">'+fmt(t.prompt_tokens||0)+'</td>'
    + '<td class="mono">'+fmt(t.completion_tokens||0)+'</td>'
    + '<td class="mono">'+fmt(t.cache_read_tokens||0)+'</td>'
    + '<td class="mono">'+pct(t.cache_rate_pct)+'</td>'
    + '<td class="mono">'+cpm(t.credits_per_million)+'</td>'

/* ─── 请求流水 ─── */
const reqState = { page:1, pageSize:50, total:-1 };
function reqFilters(){
  const q = new URLSearchParams();
  const uid = document.getElementById('fUid').value.trim();
  const model = document.getElementById('fModel').value.trim();
  const outcome = document.getElementById('fOutcome').value.trim();
  if(uid) q.set('uid', uid);
  if(model) q.set('model', model);
  if(outcome) q.set('outcome', outcome);
  return q;
}
function clearReqFilters(){
  document.getElementById('fUid').value='';
  document.getElementById('fModel').value='';
  document.getElementById('fOutcome').value='';
  reqState.page = 1;
  loadRequests(true);
}
function gotoReqs(page, pageSize){
  if(pageSize) reqState.pageSize = Number(pageSize)||50;
  reqState.page = Math.max(1, page||1);
  loadRequests(true);
}
async function loadRequests(force){
  const q = reqFilters();
  const offset = (reqState.page - 1) * reqState.pageSize;
  q.set('offset', offset);
  q.set('limit', reqState.pageSize);
  const el = document.getElementById('reqTable');
  try{
    const d = await apiGet('/admin/api/requests?'+q.toString(), 'requests', 2000, force);
    const ml = document.getElementById('metricsLine');
    ml.style.display='';
    if(!d.enabled){
      ml.className='login-status'; ml.textContent='请求记录未开启';
      el.innerHTML=''; return;
    }
    const m = d.metrics||{};
    ml.className='login-status';
    ml.textContent = '总计 '+fmt(m.total)+' · 成功 '+fmt(m.succeeded)+' · 失败 '+fmt(m.failed)
      + ' · 换号 '+fmt(m.rotates)+' · 平均延迟 '+fmt(Math.round(m.avg_latency_ms||0))+'ms'
      + ' · 成功率 '+((m.success_rate||0)*100).toFixed(1)+'%'
      + ' · 在途 '+fmt(m.in_flight)
      + (m.tps_samples? ' · 平均吞吐 '+tps(m.avg_tps)+' tok/s（'+fmt(m.tps_samples)+' 样本，平均生成 '+fmt(Math.round(m.avg_gen_ms||0))+'ms）':'')
      + (d.archive? ' · 归档 '+fmt(d.archive.files)+' 文件 / '+(d.archive.bytes/1048576).toFixed(1)+'MB':'');
    // total=-1 表示带过滤条件时不做全量扫描（总数未知），分页器退化为相对翻页。
    reqState.total = (d.total==null? -1 : d.total);
    reqState.page = Math.floor((d.offset||0)/(d.limit||reqState.pageSize)) + 1;
    if(d.limit) reqState.pageSize = d.limit;
    const evs = d.events||[];
    renderPager('pgReqs', reqState.page, reqState.pageSize, reqState.total, 'gotoReqs');
    if(!evs.length){ el.innerHTML='<div style="color:var(--dim);padding:14px">'+(reqState.page>1?'该页没有记录':'暂无记录')+'</div>'; return; }
    el.innerHTML = '<table class="accts"><thead><tr><th>时间</th><th>模型</th><th>账号</th><th>状态</th><th>结果</th>'
      + '<th title="客户端看到第一个字的时刻（含选号/建连/上游排队/首包）">首字</th>'
      + '<th title="上游开始吐第一帧的时刻，可与首字对比看本端处理开销">上游首帧</th>'
      + '<th title="首帧→末帧的纯生成时长，TPS 的分母">生成</th>'
      + '<th title="completion_tokens / 生成时长">吞吐</th>'
      + '<th>延迟</th><th>tokens</th><th>换号</th></tr></thead><tbody>'
      + evs.map(e=>{
          // outcome 取值与 reqlog.Outcome* 常量一一对应，只认 success 为成功。
          const ok = e.outcome==='success';
          const cls = ok?'b-ok':(e.outcome==='interrupted'?'b-dim':'b-bad');
          return '<tr>'
            + '<td class="mono">'+esc(new Date(e.time).toLocaleTimeString())+'</td>'
            + '<td class="mono">'+esc(e.model||'-')+'</td>'
            + '<td class="mono">'+esc((e.nickname?e.nickname+' / ':'')+(e.uid||'-'))+'</td>'
            + '<td class="mono">'+esc(e.status||'-')+'</td>'
            + '<td>'+badge(e.outcome||'-', cls)+(e.error?'<div class="mono" style="color:var(--dim);margin-top:4px">'+esc(String(e.error).slice(0,80))+'</div>':'')+'</td>'
            + '<td class="mono" style="color:var(--dim)">'+ms(e.ttft_ms)+'ms</td>'
            + '<td class="mono" style="color:var(--dim)">'+ms(e.upstream_ttf_ms)+'ms</td>'
            + '<td class="mono" style="color:var(--dim)">'+ms(e.gen_ms)+'ms</td>'
            + '<td class="mono">'+tps(e.tps)+' tok/s'
              + (e.max_gap_ms? '<div style="font-size:10px;color:var(--dim)" title="相邻帧最大间隔，越大越卡">空档 '+ms(e.max_gap_ms)+'ms</div>':'')
              + '</td>'
            + '<td class="mono">'+fmt(e.latency_ms)+'ms</td>'
            + '<td class="mono">'+fmt(e.total_tokens||0)+'</td>'
            + '<td class="mono">'+fmt(e.rotates||0)+'</td>'
            + '</tr>';
        }).join('')
      + '</tbody></table>';
  }catch(e){
    if(e.name === 'AbortError') return;
    el.innerHTML='<div style="color:var(--bad)">加载失败：'+esc(e.message)+'</div>';
  }
}

/* ─── 导入 ─── */
async function importCred(){
  const v = document.getElementById('impInput').value.trim();
  if(!v){ return; }
  const st = document.getElementById('impStatus');
  st.style.display=''; st.className='login-status'; st.textContent='导入中...';
  let body, contentType;
  if(v.startsWith('{') || v.startsWith('[')){
    body = JSON.stringify({json: v}); contentType='application/json';
  } else {
    body = JSON.stringify({callback_url: v}); contentType='application/json';
  }
  try{
    const r = await fetch('/admin/api/accounts/import', {
      method:'POST', headers:{'Content-Type':contentType, ...authHeader()}, body
    });
    const d = await r.json();
    if(!r.ok){ st.className='login-status err'; st.textContent='导入失败：'+apiErr(d)+(d.accounts?importDetail(d):''); return; }
    st.className='login-status ok';
    st.textContent = d.accounts ? importSummary(d) : ('导入成功：'+(d.nickname||d.uid||''));
    document.getElementById('impInput').value='';
    invalidate('/admin/api/accounts'); loadAccounts(true);
  }catch(e){ st.className='login-status err'; st.textContent='导入失败：'+e.message; }
}

/* 批量导入结果摘要 */
function importSummary(d){
  return '批量导入：共 '+(d.total||0)+' 条，新增 '+(d.created||0)+'，更新 '+(d.updated||0)+'，失败 '+(d.failed||0)+importDetail(d);
}
function importDetail(d){
  const bad = (d.accounts||[]).filter(x=>x.error);
  if(!bad.length) return '';
  return '；失败明细：'+bad.slice(0,5).map(x=>(x.nickname||x.uid||'?')+' → '+x.error).join(' / ')+(bad.length>5?' …':'');
}

/* 文件导入：读文件内容后走同一导入通道（多文件逐个提交） */
async function importFiles(input){
  const files = Array.from(input.files||[]);
  if(!files.length) return;
  const st = document.getElementById('impStatus');
  st.style.display=''; st.className='login-status'; st.textContent='读取 '+files.length+' 个文件...';
  let ok=0, fail=0, lastErr='';
  for(const f of files){
    let text='';
    try{ text = await f.text(); }catch(e){ fail++; lastErr=f.name+' 读取失败'; continue; }
    try{
      const r = await fetch('/admin/api/accounts/import', {
        method:'POST', headers:{'Content-Type':'application/json', ...authHeader()},
        body: JSON.stringify({json: text})
      });
      const d = await r.json();
      if(!r.ok){ fail++; lastErr = f.name+'：'+apiErr(d)+(d.accounts?importDetail(d):''); }
      else { ok += (d.total||1); }
    }catch(e){ fail++; lastErr=f.name+'：'+e.message; }
  }
  st.className = fail? 'login-status err':'login-status ok';
  st.textContent = '文件导入完成：成功 '+ok+' 条'+(fail?('，'+fail+' 个文件失败（'+lastErr+'）'):'');
  input.value='';
  invalidate('/admin/api/accounts'); loadAccounts(true);
}

async function testAcct(uid){
  const model = prompt('用哪个模型测试连通性？（留空用默认模型）','');
  if(model===null) return;
  const st = document.getElementById('bulkStatus');
  st.style.display=''; st.className='login-status'; st.textContent='测试中…';
  const q = model.trim() ? '?model='+encodeURIComponent(model.trim()) : '';
  const r = await fetch('/admin/api/accounts/'+encodeURIComponent(uid)+'/test'+q, {
    method:'POST', headers: authHeader()
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok){ st.className='login-status err'; st.textContent='测试失败：'+apiErr(d); return; }
  if(d.ok){
    st.className='login-status ok';
    st.textContent='连通正常 · '+d.model+' · '+d.latency_ms+'ms';
  } else {
    st.className='login-status err';
    st.textContent='不可用：'+(d.error||'')+(d.kind?'［'+d.kind+'］':'');
  }
}
async function exportCreds(uids){
  // 默认脱敏导出（只给前缀 + 长度）；明文导出是可导入的完整凭证，属于高危操作，
  // 必须二次确认，且服务端会写审计日志。
  const wantRaw = confirm('导出完整凭证？\n\n确定：完整凭证，可重新导入，请妥善保管。\n取消：脱敏副本，仅供查看。');
  let detail = '';
  if(wantRaw){
    detail = prompt('导出完整凭证：输入 RAW 确认', '');
    if((detail||'').trim().toUpperCase() !== 'RAW') return false;
  }
  const url0 = '/admin/api/accounts/export' + (wantRaw ? '?raw=1' : '');
  const r = await fetch(url0, {method:'POST',headers:{'Content-Type':'application/json',...authHeader()},body:JSON.stringify({uids}),cache:'no-store'});
  if(!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(apiErr(e)); }
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'trae2api-web-accounts-' + (wantRaw?'raw-':'masked-') + new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  return true;
}

/* ─── Web 登录闭环 ─── */
async function startLogin(){
  const st = document.getElementById('loginStatus');
  st.style.display=''; st.className='login-status'; st.textContent='生成登录链接...';
  const btn = document.getElementById('loginBtn'); btn.disabled = true;
  try{
    const r = await fetch('/admin/api/login', {method:'POST', headers:{'Content-Type':'application/json', ...authHeader()}, body:'{}'});
    const d = await r.json();
    if(!r.ok){ st.className='login-status err'; st.textContent='生成失败：'+apiErr(d); btn.disabled=false; return; }
    if(d.warn){
      // 回调链路可能不通（未配置 TW2A_PUBLIC_BASE_URL / Docker 下 127.0.0.1 不可达）
      st.className='login-status err';
      st.textContent = '已打开登录窗口，但存在风险：' + d.warn;
      st.textContent += '\n回调地址：' + (d.callback_url||'');
    } else {
      st.className='login-status';
      st.textContent = '已打开登录窗口，请在浏览器完成手机号登录。完成后此页自动刷新。';
    }
    window.open(d.login_url, '_blank');
    pollLogin(d.pending_id);
  }catch(e){ st.className='login-status err'; st.textContent='生成失败：'+e.message; btn.disabled=false; }
}
function pollLogin(pid){
  if(loginPollTimer) clearInterval(loginPollTimer);
  const st = document.getElementById('loginStatus');
  let waited = 0;
  loginPollTimer = setInterval(async ()=>{
    waited += 2;
    if(waited > 180){ clearInterval(loginPollTimer); st.className='login-status err'; st.textContent='登录超时（3分钟），请重试'; document.getElementById('loginBtn').disabled=false; return; }
    try{
      const r = await fetch('/admin/api/login/result?pending_id='+encodeURIComponent(pid), {cache:'no-store'});
      const d = await r.json();
      if(d.state==='success'){
        clearInterval(loginPollTimer);
        st.className='login-status ok';
        st.textContent='登录成功：'+(d.nickname||'')+'（'+(d.uid||'')+'）';
        document.getElementById('loginBtn').disabled=false;
        invalidate('/admin/api/accounts'); loadAccounts(true);
      } else if(d.state==='failed'){
        clearInterval(loginPollTimer);
        st.className='login-status err';
        st.textContent='登录失败：'+(d.error||'未知');
        document.getElementById('loginBtn').disabled=false;
      } else {
        st.textContent = '等待登录回调...（'+waited+'s）';
      }
    }catch(e){ /* 瞬时错误继续轮询 */ }
  }, 2000);
}

/* ─── 额度监控（原卡片视图，保留） ─── */
function renderCredits(d){
  const grid = document.getElementById('grid');
  if(!d.accounts || d.accounts.length===0){
    grid.innerHTML = '<div style="color:var(--dim)">暂无账号</div>';
    return;
  }
  grid.innerHTML = d.accounts.map(a=>{
    let badges = '';
    if(a.error) badges += badge('查询失败','b-bad');
    else {
      if(a.checked_in) badges += badge('已签到','b-ok');
      else badges += a.checkin_enable ? badge('未签到','b-warn') : badge('签到禁用','b-dim');
      if(a.cooling) badges += badge('冷却中','b-warn');
      if(a.disabled) badges += badge('已禁用','b-bad');
      if(a.packs>0) badges += badge(a.packs+' 权益包','b-dim');
    }
    const remainLine = a.error ? '<div style="color:var(--bad);font-size:14px">额度查询失败</div>'
      : '<div class="remain">'+fmt(a.remain)+'<span>积分剩余</span></div>';
    const meta = a.error ? '' :
      '<div class="meta"><span>总量 <b>'+fmt(a.limit)+'</b></span><span>已用 <b>'+fmt(a.used)+'</b></span>'+
      (a.checkin_enable ? '<span>今日可领 <b>'+fmt(a.checkin_credits)+'</b></span>' : '')+'</div>';
    return '<div class="card'+(a.error?' err':'')+'">'
      + '<div class="card-top"><div><div class="nick">'+esc(a.nickname||'(未命名)')+'</div>'
      + '<div class="uid">'+esc(a.uid)+'</div></div><div class="badges">'+badges+'</div></div>'
      + remainLine + meta
      + (a.error ? '<div class="errline">'+esc(a.error)+'</div>' : '')
      + '</div>';
  }).join('');
}
const creditState = { page:1, pageSize:30, total:0 };
function gotoCredits(page, pageSize){
  if(pageSize) creditState.pageSize = Number(pageSize)||30;
  creditState.page = Math.max(1, page||1);
  loadCredits(false);
}
async function loadCredits(force){
  const q = new URLSearchParams();
  q.set('page', creditState.page);
  q.set('page_size', creditState.pageSize);
  if(force) q.set('refresh','1');
  const grid = document.getElementById('grid');
  const meta = document.getElementById('creditMeta');
  if(meta){ meta.style.display=''; meta.className='login-status'; meta.textContent = force? '正在查询上游…':'加载中…'; }
  try{
    // 强制刷新前先丢掉客户端旧缓存，否则翻到第 2 页又会拿到 60 秒前的数据。
    if(force) invalidate('/admin/api/credits');
    const d = await apiGet('/admin/api/credits?'+q.toString(), 'credits', 60000, !!force);
    creditState.total = (d.total==null? (d.accounts||[]).length : d.total);
    creditState.page = d.page || creditState.page;
    creditState.pageSize = d.page_size || creditState.pageSize;
    renderCredits(d);
    renderPager('pgCredits', creditState.page, creditState.pageSize, creditState.total, 'gotoCredits');
    if(meta){
      meta.className='login-status';
      meta.textContent = '更新于 '+d.fetched_at+' · '+fmt(creditState.total)+' 个账号'+(d.cached?' · 缓存':'');
    }
  }catch(e){
    if(e.name === 'AbortError') return;
    grid.innerHTML = '<div style="color:var(--bad)">加载失败：'+esc(e.message)+'</div>';
    if(meta) meta.textContent = '';
  }
}

/* 初始 */
loadAccounts(true);
</script>
