# 从源码构建并启动：docker compose up -d --build
# 默认监听 host 8000 → 容器 8000。
services:
  tw2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: trae2api-web:local
    # 容器名可用 TW2A_CONTAINER_NAME 覆盖（同机跑多个实例时不冲突）
    container_name: ${TW2A_CONTAINER_NAME:-trae2api-web}
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # 服务鉴权 key：务必改成自己的随机串（面板/API 都用它）
      - TW2A_API_KEY=${TW2A_API_KEY:-changeme}
      # 容器内固定 8000，与下面 ports 映射保持一致
      - TW2A_LISTEN=:8000
      # TRAE 登录回调端口（容器内起 127.0.0.1:18080；面板手动粘贴回调链接时可忽略）
      - TW2A_CALLBACK_PORT=${TW2A_CALLBACK_PORT:-18080}
    ports:
      - "${TW2A_PORT:-8000}:8000"
    volumes:
      # 账号凭证与运行态（state/usage/流水）持久化到宿主
      - ./auths:/app/auths
      - ./data:/app/data
      # 想用宿主 config.json 覆盖默认配置时，取消下一行注释
      # - ./config.json:/app/config.json:ro
    # 容器 stdout 日志轮转。docker 的 json-file 驱动只能按「大小+份数」限制，
    # 不支持按天，所以这里用「20MB × 3 份」近似三天量级：本服务 stdout 只有
    # 启动信息与少量错误，正常一天远达不到 20MB。
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
